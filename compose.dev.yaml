# Dev environment for Second Brain — db + minio, plus an opt-in Telegram bot profile.
# API and web run directly on the host (uvicorn --reload + vite HMR) for fast iteration.
# Everything binds to 127.0.0.1 — never exposed. Prod stack (compose.yaml) untouched.
name: secondbrain-dev

services:
  db:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secondbrain_dev}
      POSTGRES_USER: ${POSTGRES_USER:-secondbrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.dev}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dev-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-secondbrain}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env.dev}
    ports:
      - "127.0.0.1:9100:9000"
    volumes:
      - dev-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  bot:
    profiles: ["bot"]
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    restart: unless-stopped
    network_mode: host
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      SECOND_BRAIN_API_URL: http://127.0.0.1:8000
      SB_VERIFICATION_BASE: ${SB_VERIFICATION_BASE:-http://localhost:5173}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
      SB_BOT_STATE_FILE: /data/state.json
    volumes:
      - dev-bot-data:/data

volumes:
  dev-postgres-data:
  dev-minio-data:
  dev-bot-data:
