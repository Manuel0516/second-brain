name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Deploy tested commit
        run: |
          ssh -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" bash -s -- "$DEPLOY_SHA" <<'REMOTE'
          set -euo pipefail

          deploy_sha="$1"
          cd /home/manuel/services/second-brain

          test -z "$(git status --porcelain)" || {
            echo "Refusing to deploy over local repository changes" >&2
            exit 1
          }

          git fetch --quiet origin "$deploy_sha"
          git checkout --detach "$deploy_sha"
          docker compose config --quiet
          docker compose build api web
          docker compose up -d --remove-orphans
          docker compose ps
          curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 \
            https://brain.zero-five.space/api/ready
          REMOTE
