name: secondbrain

services:
  db:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secondbrain}
      POSTGRES_USER: ${POSTGRES_USER:-secondbrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-secondbrain}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-dev}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-secondbrain}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-secondbrain}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-30}
      INITIAL_USER_USERNAME: ${INITIAL_USER_USERNAME:-manuel}
      INITIAL_USER_EMAIL: ${INITIAL_USER_EMAIL:?Set INITIAL_USER_EMAIL in .env}
      INITIAL_USER_PASSWORD: ${INITIAL_USER_PASSWORD:?Set INITIAL_USER_PASSWORD in .env}
      LOGIN_RATE_LIMIT_ATTEMPTS: ${LOGIN_RATE_LIMIT_ATTEMPTS:-5}
      LOGIN_RATE_LIMIT_WINDOW_MINUTES: ${LOGIN_RATE_LIMIT_WINDOW_MINUTES:-5}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_TOKEN_ENCRYPTION_KEY: ${GOOGLE_TOKEN_ENCRYPTION_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CALENDAR_SYNC_INTERVAL_MINUTES: ${CALENDAR_SYNC_INTERVAL_MINUTES:-15}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.5-flash}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-secondbrain}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - internal
      - egress
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik"
      traefik.http.routers.secondbrain.rule: "Host(`brain.zero-five.space`)"
      traefik.http.routers.secondbrain.entrypoints: "websecure"
      traefik.http.routers.secondbrain.tls.certresolver: "letsencrypt"
      # brain.zero-five.space must resolve to the WireGuard address (10.8.0.1).
      # Traefik rejects requests that arrive from outside the VPN subnet.
      traefik.http.routers.secondbrain.middlewares: "secondbrain-vpn-only"
      traefik.http.middlewares.secondbrain-vpn-only.ipwhitelist.sourcerange: "10.8.0.0/24"
      traefik.http.services.secondbrain.loadbalancer.server.port: "80"
      hub.enable: "true"
      hub.name: "Second Brain"
      hub.kind: "web"
      hub.url: "https://brain.zero-five.space"
      hub.icon: "🧠"
      hub.visibility: "admin"

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      SECOND_BRAIN_API_URL: http://api:8000
      SB_VERIFICATION_BASE: https://brain.zero-five.space
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-1110963147}
      SB_BOT_STATE_FILE: /data/state.json
    volumes:
      - bot-data:/data
    networks:
      - internal
      - egress
    depends_on:
      api:
        condition: service_healthy

networks:
  internal:
    internal: true
  # ponytail: api needs egress for Google/ICS calendar sync (outbound HTTPS);
  # db/minio stay internal-only since they never call out.
  egress: {}
  traefik:
    external: true
    name: traefik

volumes:
  postgres-data:
  minio-data:
  bot-data:
