[project]
name = "secondbrain-api"
version = "0.1.0"
description = "Second Brain FastAPI backend"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "argon2-cffi>=21.2.0",
    "fastapi<0.136",
    "greenlet>=3.0.0",
    "httpx>=0.28.1",
    "minio>=7.2.16",
    "python-multipart>=0.0.18",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.14.2",
    "PyJWT>=2.8.0",
    "pyotp>=2.9.0",
    "psycopg[binary]>=3.3.4",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-anyio>=0.0.0",
    "ruff>=0.15.20",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"] # FastAPI dependency injection intentionally uses callable defaults.

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
